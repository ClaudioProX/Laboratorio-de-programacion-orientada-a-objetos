<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventurero - Spring Boot</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 80px; background-color: #1a1a2e; color: #e0e0e0; }
        h1 { color: #f0c040; }
        .caja { display: inline-block; border: 2px solid #4a90d9; border-radius: 12px; padding: 30px 60px; margin-top: 20px; }
        .dato { font-size: 1.2em; margin: 12px 0; }
        strong { color: #4a90d9; }
        a { color: #f0c040; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Aventurero del Gremio</h1>
        <p class="dato">Aventurero: <strong th:text="${aventurero.nombre}">Nombre</strong></p>
        <p class="dato">Clase: <strong th:text="${aventurero.clase}">Clase</strong></p>
        <p class="dato">Nivel: <strong th:text="${aventurero.nivel}">0</strong></p>
        <p><a href="/saludo">Volver al saludo</a></p>
    </div>
</body>
</html>
